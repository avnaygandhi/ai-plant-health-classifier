<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
    }
    #camera-input { display: none; }
    .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #2E7D32;
      color: #fff;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      user-select: none;
    }
    .open-btn:hover { background-color: #1B5E20; }
    #preview-wrap { margin-top: 12px; display: none; }
    #preview { max-width: 100%; border-radius: 10px; display: block; }
    .retake-btn {
      margin-top: 8px;
      background: #555;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <label class="open-btn" for="camera-input">📷 Open Rear Camera</label>
  <input type="file" id="camera-input" accept="image/*" capture="environment">
  <div id="preview-wrap">
    <img id="preview" alt="Captured photo">
    <br>
    <button class="retake-btn" id="retake-btn">↺ Retake Photo</button>
  </div>

  <script>
    // Inline Streamlit component protocol — no external CDN needed
    var Streamlit = {
      setComponentReady: function () {
        window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
      },
      setComponentValue: function (value) {
        window.parent.postMessage({ type: "streamlit:setComponentValue", value: value }, "*");
      },
      setFrameHeight: function (height) {
        window.parent.postMessage({ type: "streamlit:setFrameHeight", height: height }, "*");
      }
    };

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(54);

    var input = document.getElementById("camera-input");
    var previewWrap = document.getElementById("preview-wrap");
    var preview = document.getElementById("preview");
    var retakeBtn = document.getElementById("retake-btn");

    input.addEventListener("change", function () {
      var file = this.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        previewWrap.style.display = "block";
        setTimeout(function () {
          Streamlit.setFrameHeight(document.body.scrollHeight + 8);
        }, 120);
        Streamlit.setComponentValue(e.target.result);
      };
      reader.readAsDataURL(file);
    });

    retakeBtn.addEventListener("click", function () {
      input.value = "";
      previewWrap.style.display = "none";
      Streamlit.setFrameHeight(54);
      Streamlit.setComponentValue(null);
    });
  </script>
</body>
</html>
